name: Deploy

# Migrates the database, builds the images in ACR and rolls the Azure Container
# Apps. Needs the AZURE_CREDENTIALS repo secret (service principal with
# Contributor on the clams-rg resource group).
#
# Only the parts that actually changed are rebuilt: the `changes` job diffs the
# push and every other job gates on it. A backend-only commit never pays for the
# (slow) Flutter APK build; an admin-only commit reuses the APK already being
# served at /download instead of rebuilding an identical one.
#
# ---------------------------------------------------------------------------
# MIGRATIONS RUN BEFORE THE NEW IMAGE ROLLS, so for a short window the OLD code
# is running against the NEW schema. Every migration must therefore be
# backward-compatible with the code already deployed:
#
#   Safe in one deploy   — adding a table, a nullable column, an index, an enum
#                          VALUE, a column with a DEFAULT.
#   Needs two deploys    — dropping or renaming a column or table, making a
#                          column NOT NULL, narrowing a type. Ship the code that
#                          stops using it first, then the migration that removes
#                          it. (Expand, then contract.)
#
# The alternative — migrating after the rollout — is worse: the new code would
# be live against the old schema, which is a guaranteed outage rather than a
# constraint to design around.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "admin/**"
      - "mobile/**"
      - ".github/workflows/deploy.yml"

env:
  ACR: clamsacr8ca7
  RESOURCE_GROUP: clams-rg
  PG_SERVER: clams-pg-8ca7
  API_BASE_URL: https://clams-api.lemoncoast-b230ecb6.centralindia.azurecontainerapps.io/api/v1
  ADMIN_BASE_URL: https://clams-admin.lemoncoast-b230ecb6.centralindia.azurecontainerapps.io

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # A manual workflow_dispatch has no diff to inspect and reports no
          # changes; each job below treats that case as "rebuild everything".
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
            admin:
              - 'admin/**'
              - '.github/workflows/deploy.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/deploy.yml'

  apk:
    name: Build Android APK
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret — building debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/clams-release.jks
          cat > android/key.properties <<EOF
          storeFile=clams-release.jks
          storePassword=$STORE_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF
          echo "Release signing configured."
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL
      - uses: actions/upload-artifact@v4
        with:
          name: clams-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  migrate:
    name: Migrate database
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A rule name unique to this run, so a leftover from a hard-cancelled run
    # can never be mistaken for the live one.
    env:
      FW_RULE: gh-migrate-${{ github.run_id }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # The server only admits Azure services, and a GitHub runner is not one.
      # Open a pinhole for this runner's address and shut it again below.
      #
      # az 2.86 (May 2026) flips these flags: --name stops meaning the server and
      # starts meaning the rule, with the server moving to -s. Which one a runner
      # has is not ours to decide, so try the new form and fall back to the old.
      - name: Open the firewall for this runner
        run: |
          pgfw() {
            local verb="$1" rule="$2"; shift 2
            az postgres flexible-server firewall-rule "$verb" \
              -g "$RESOURCE_GROUP" -s "$PG_SERVER" -n "$rule" "$@" 2>/dev/null \
            || az postgres flexible-server firewall-rule "$verb" \
              -g "$RESOURCE_GROUP" --name "$PG_SERVER" --rule-name "$rule" "$@"
          }

          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          pgfw create "$FW_RULE" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" -o none

          # Sweep pinholes abandoned by hard-cancelled runs. Safe because the
          # concurrency group means no other deploy for this ref is in flight.
          STALE=$(az postgres flexible-server firewall-rule list \
                    -g "$RESOURCE_GROUP" -s "$PG_SERVER" \
                    --query "[?starts_with(name,'gh-migrate-')].name" -o tsv 2>/dev/null \
                  || az postgres flexible-server firewall-rule list \
                    -g "$RESOURCE_GROUP" --name "$PG_SERVER" \
                    --query "[?starts_with(name,'gh-migrate-')].name" -o tsv)
          for rule in $STALE; do
            if [ "$rule" != "$FW_RULE" ]; then
              echo "Removing firewall rule left behind by an earlier run: $rule"
              pgfw delete "$rule" --yes -o none || true
            fi
          done

      # Read the connection string off the container app rather than keeping a
      # second copy as a repo secret — the migration then cannot be pointed at a
      # different database from the one the API actually uses.
      - name: Apply migrations
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          DATABASE_URL=$(az containerapp secret show -g "$RESOURCE_GROUP" -n clams-api \
            --secret-name database-url --query value -o tsv)
          echo "::add-mask::$DATABASE_URL"
          test -n "$DATABASE_URL"
          DATABASE_URL="$DATABASE_URL" npx prisma migrate deploy
          DATABASE_URL="$DATABASE_URL" npx prisma migrate status

      - name: Close the firewall
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete \
            -g "$RESOURCE_GROUP" -s "$PG_SERVER" -n "$FW_RULE" --yes -o none 2>/dev/null \
          || az postgres flexible-server firewall-rule delete \
            -g "$RESOURCE_GROUP" --name "$PG_SERVER" --rule-name "$FW_RULE" --yes -o none \
          || echo "::warning::Could not remove firewall rule $FW_RULE — remove it by hand."

  deploy-api:
    name: Deploy API
    # The schema goes first: the new image must never start against a database
    # that has not caught up. `migrate` runs under exactly this job's condition,
    # so the two are always both-or-neither and a plain `needs` is enough.
    needs: [changes, migrate]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build image in ACR
        run: |
          TAG=${GITHUB_SHA::7}
          cd backend && az acr build --registry $ACR --image clams-api:$TAG --file Dockerfile .
      - name: Roll container app
        run: |
          TAG=${GITHUB_SHA::7}
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -g $RESOURCE_GROUP -n clams-api \
            --image $ACR.azurecr.io/clams-api:$TAG
      - name: Verify health
        run: |
          sleep 20
          curl -fsS "$API_BASE_URL/health"

  deploy-admin:
    name: Deploy Admin
    needs: [changes, apk]
    # `apk` is skipped on an admin-only commit, and a skipped need would skip
    # this job too — so gate on the outcome explicitly rather than on success().
    if: |
      always()
      && needs.apk.result != 'failure'
      && needs.apk.result != 'cancelled'
      && (needs.changes.outputs.admin == 'true'
          || needs.changes.outputs.mobile == 'true'
          || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The admin image serves the APK at /download, so the image always needs
      # one baked in. Fresh build when mobile changed; otherwise re-use the APK
      # the live admin is already serving so we don't rebuild an identical one.
      - name: Fetch freshly built APK
        if: needs.apk.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: clams-apk
          path: apk
      # Take the newest APK this workflow ever built, NOT whatever the live site
      # happens to be serving.
      #
      # Reading it off /download looks equivalent and is not. If an APK builds
      # successfully and then the admin deploy fails — a broken lock file, a bad
      # image, anything — that APK never reaches the site. The next admin-only
      # push skips the `apk` job, copies the OLD binary off the still-running
      # container, and bakes it back in. The stale build then survives every
      # subsequent deploy, because each one keeps re-reading it from the last.
      # That is exactly how /download ended up an APK behind.
      #
      # The artifact is the authoritative copy: any change under mobile/ builds
      # one, so the newest artifact always matches the newest mobile source
      # whether or not it has managed to reach production yet.
      - name: Re-use the last APK this workflow built
        if: needs.apk.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk
          if gh run download --repo "$GITHUB_REPOSITORY" -n clams-apk -D apk 2>/dev/null \
             && [ -s apk/app-release.apk ]; then
            echo "Using the most recent clams-apk artifact."
          else
            # Artifacts expire (90 days). Falling back to the live copy is worse
            # but still better than shipping an image with no APK at all.
            echo "::warning::No clams-apk artifact found — falling back to the APK currently on /download."
            curl -fsSL "$ADMIN_BASE_URL/download" -o apk/app-release.apk
          fi
          test -s apk/app-release.apk

      - name: Bake the APK into the image
        id: apk_file
        run: |
          cp apk/app-release.apk admin/public/CLAMS.apk
          echo "sha=$(sha256sum admin/public/CLAMS.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -l admin/public/CLAMS.apk

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build image in ACR
        run: |
          TAG=${GITHUB_SHA::7}
          cd admin && az acr build --registry $ACR --image clams-admin:$TAG --file Dockerfile .
      - name: Roll container app
        run: |
          TAG=${GITHUB_SHA::7}
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -g $RESOURCE_GROUP -n clams-admin \
            --image $ACR.azurecr.io/clams-admin:$TAG
      # Checks WHICH binary is being served, not merely that something is.
      # Asserting the Content-Disposition header alone passed happily for days
      # while /download handed out a stale APK — the header is identical either
      # way. Comparing the checksum is the only form of this test that can fail
      # for the reason worth catching.
      - name: Verify /download serves the APK we just baked
        run: |
          sleep 20
          curl -fsSI "$ADMIN_BASE_URL/download" | tee headers.txt
          grep -qi "content-disposition: attachment" headers.txt

          curl -fsSL "$ADMIN_BASE_URL/download" -o served.apk
          SERVED=$(sha256sum served.apk | cut -d' ' -f1)
          echo "expected: ${{ steps.apk_file.outputs.sha }}"
          echo "served  : $SERVED"
          if [ "$SERVED" != "${{ steps.apk_file.outputs.sha }}" ]; then
            echo "::error::/download is serving a different APK than this deploy baked in."
            exit 1
          fi
          echo "/download matches the APK from this deploy."
